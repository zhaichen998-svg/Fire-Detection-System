# Improved Fire Detection Model V2 - Custom Loss Functions

experiment_name: improved_v2_custom_loss

# Model configuration
model:
  type: improved
  version: v2
  num_classes: 2  # flame and smoke
  size: s  # small for better performance
  pretrained: true
  img_size: 640
  conf_threshold: 0.25
  iou_threshold: 0.45

# Data configuration
data:
  class_names: ['flame', 'smoke']
  train_img_dir: data/train/images
  train_label_dir: data/train/labels
  val_img_dir: data/val/images
  val_label_dir: data/val/labels
  test_img_dir: data/test/images
  test_label_dir: data/test/labels
  num_workers: 4

# Training configuration
training:
  epochs: 150
  batch_size: 12  # Reduced for larger model
  lr: 0.01
  min_lr: 0.000001
  weight_decay: 0.0005
  momentum: 0.937
  warmup_epochs: 5
  patience: 50
  save_interval: 10
  log_interval: 10

# Augmentation configuration
augmentation:
  mode: medium
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 5.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.1

# Custom loss configuration
loss:
  cls_loss_weight: 1.5
  box_loss_weight: 7.5
  obj_loss_weight: 1.0
  use_focal: true
  focal_alpha: 0.25
  focal_gamma: 2.0
  use_giou: true
  wiou_beta: 0.5

# Optimizer configuration
optimizer:
  type: adamw
  betas: [0.9, 0.999]
  eps: 0.00000001

# Scheduler configuration
scheduler:
  type: cosine
  warmup_steps: 1500
